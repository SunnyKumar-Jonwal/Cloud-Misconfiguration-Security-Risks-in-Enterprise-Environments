<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Liberation Serif, Times New Roman, serif">
<rect width="1200" height="620" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="30" y="70" width="208" height="290" rx="12" fill="#ece6f6" stroke="#5b3f8c" stroke-width="2.5"/>
<circle cx="134.0" cy="115" r="26" fill="#5b3f8c"/><text x="134.0" y="124" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="134.0" y="178" font-size="24" font-weight="bold" text-anchor="middle">Govern</text>
<text x="134.0" y="230" font-size="15" text-anchor="middle">landing zone · ownership</text>
<text x="134.0" y="268" font-size="15" text-anchor="middle">data classification tags</text>
<text x="134.0" y="306" font-size="15" text-anchor="middle">exceptions with expiry</text>
<line x1="240" y1="215.0" x2="261" y2="215.0" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
<rect x="263" y="70" width="208" height="290" rx="12" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2.5"/>
<circle cx="367.0" cy="115" r="26" fill="#2f5d9e"/><text x="367.0" y="124" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="367.0" y="178" font-size="24" font-weight="bold" text-anchor="middle">Guardrail</text>
<text x="367.0" y="230" font-size="15" text-anchor="middle">SCPs · Azure Policy deny</text>
<text x="367.0" y="268" font-size="15" text-anchor="middle">account Block Public Access</text>
<text x="367.0" y="306" font-size="15" text-anchor="middle">IMDSv2, encryption by default</text>
<line x1="473" y1="215.0" x2="494" y2="215.0" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
<rect x="496" y="70" width="208" height="290" rx="12" fill="#e3f2e6" stroke="#2e7d32" stroke-width="2.5"/>
<circle cx="600.0" cy="115" r="26" fill="#2e7d32"/><text x="600.0" y="124" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="600.0" y="178" font-size="24" font-weight="bold" text-anchor="middle">Shift left</text>
<text x="600.0" y="230" font-size="15" text-anchor="middle">IaC scan in pull request</text>
<text x="600.0" y="268" font-size="15" text-anchor="middle">policy as code · SARIF</text>
<text x="600.0" y="306" font-size="15" text-anchor="middle">gate on critical / high</text>
<line x1="706" y1="215.0" x2="727" y2="215.0" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
<rect x="729" y="70" width="208" height="290" rx="12" fill="#fff4dc" stroke="#a66b00" stroke-width="2.5"/>
<circle cx="833.0" cy="115" r="26" fill="#a66b00"/><text x="833.0" y="124" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="833.0" y="178" font-size="24" font-weight="bold" text-anchor="middle">Monitor</text>
<text x="833.0" y="230" font-size="15" text-anchor="middle">CSPM · drift detection</text>
<text x="833.0" y="268" font-size="15" text-anchor="middle">attack-path prioritisation</text>
<text x="833.0" y="306" font-size="15" text-anchor="middle">asset discovery (incl. SaaS)</text>
<line x1="939" y1="215.0" x2="960" y2="215.0" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
<rect x="962" y="70" width="208" height="290" rx="12" fill="#fbe9d8" stroke="#b35900" stroke-width="2.5"/>
<circle cx="1066.0" cy="115" r="26" fill="#b35900"/><text x="1066.0" y="124" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="1066.0" y="178" font-size="24" font-weight="bold" text-anchor="middle">Respond</text>
<text x="1066.0" y="230" font-size="15" text-anchor="middle">org-wide logging</text>
<text x="1066.0" y="268" font-size="15" text-anchor="middle">threat detection · alerts</text>
<text x="1066.0" y="306" font-size="15" text-anchor="middle">auto-fix · playbooks</text>
<text x="600" y="40" font-size="20" font-style="italic" text-anchor="middle">design → build → change → run → incident</text>
<path d="M1080,368 C1080,430 1080,430 1000,430 L200,430 C134,430 134,430 134,368" fill="none" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="600" y="420" font-size="16" fill="#b3261e" text-anchor="middle">lessons from incidents and findings become new rules and guardrails</text>
<rect x="30" y="470" width="1140" height="110" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="2"/>
<text x="600" y="510" font-size="22" font-weight="bold" text-anchor="middle">Foundation: identity and data</text>
<text x="600" y="548" font-size="17" text-anchor="middle">least privilege · no long-lived keys (OIDC federation) · MFA for every human identity · classification tags on every data store</text>
</svg>
