<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Liberation Serif, Times New Roman, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="130" y="38" font-size="20" font-weight="bold" text-anchor="middle">Inputs</text>
  <text x="600" y="38" font-size="20" font-weight="bold" text-anchor="middle">CloudGuard</text>
  <text x="1070" y="38" font-size="20" font-weight="bold" text-anchor="middle">Outputs and consumers</text>

  <!-- inputs -->
  <g font-size="16" text-anchor="middle">
    <rect x="25" y="70" width="210" height="90" rx="10" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
    <text x="130" y="105" font-weight="bold">Terraform (.tf)</text>
    <text x="130" y="130">AWS and Azure resources</text>
    <text x="130" y="150">in a pull request</text>
    <rect x="25" y="200" width="210" height="90" rx="10" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
    <text x="130" y="235" font-weight="bold">Approved baseline</text>
    <text x="130" y="260">last reviewed version</text>
    <text x="130" y="280">(for drift)</text>
    <rect x="25" y="330" width="210" height="110" rx="10" fill="#fff4dc" stroke="#a66b00" stroke-width="2"/>
    <text x="130" y="365" font-weight="bold">Rules (YAML)</text>
    <text x="130" y="390">39 policy-as-code rules</text>
    <text x="130" y="410">NIST / ATT&amp;CK mappings,</text>
    <text x="130" y="430">remediation and fix</text>
  </g>

  <!-- core -->
  <rect x="285" y="60" width="630" height="560" rx="14" fill="#f6f6f6" stroke="#333" stroke-width="2.5"/>
  <g font-size="16" text-anchor="middle">
    <rect x="315" y="85" width="570" height="80" rx="8" fill="#fff" stroke="#555"/>
    <text x="600" y="115" font-weight="bold" font-size="18">Loader (loader.py)</text>
    <text x="600" y="142">python-hcl2 parse · strip quotes · parse jsonencode/heredoc policies · resolve references</text>

    <rect x="315" y="195" width="570" height="60" rx="8" fill="#fff" stroke="#555"/>
    <text x="600" y="225" font-weight="bold" font-size="18">Inventory</text>
    <text x="600" y="246">resources with values, tags, file and line</text>

    <rect x="315" y="285" width="270" height="110" rx="8" fill="#e3f2e6" stroke="#2e7d32" stroke-width="2"/>
    <text x="450" y="315" font-weight="bold" font-size="18">Rule engine</text>
    <text x="450" y="340">(engine.py)</text>
    <text x="450" y="362">per-resource conditions,</text>
    <text x="450" y="382">IAM statements, CIDR/ports</text>

    <rect x="615" y="285" width="270" height="110" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
    <text x="750" y="315" font-weight="bold" font-size="18">Attack-path analyser</text>
    <text x="750" y="340">(attack_paths.py)</text>
    <text x="750" y="362">instance → role → policy</text>
    <text x="750" y="382">→ bucket chains (AP-1..AP-4)</text>

    <rect x="315" y="425" width="570" height="70" rx="8" fill="#ece6f6" stroke="#5b3f8c" stroke-width="2"/>
    <text x="600" y="452" font-weight="bold" font-size="18">Drift comparator (drift.py)</text>
    <text x="600" y="477">baseline vs current · changed attributes · new and resolved findings</text>

    <rect x="315" y="525" width="570" height="70" rx="8" fill="#fbe9d8" stroke="#b35900" stroke-width="2"/>
    <text x="600" y="552" font-weight="bold" font-size="18">Reporters (reporters.py)</text>
    <text x="600" y="577">table · JSON · SARIF 2.1.0 · HTML · exit code from --fail-on</text>
  </g>
  <line x1="237" y1="115" x2="311" y2="120" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M237,245 L262,245 L262,460 L311,460" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <path d="M237,385 L275,385 L275,330 L311,330" fill="none" stroke="#a66b00" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="167" x2="600" y2="191" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="450" y1="257" x2="450" y2="281" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="750" y1="257" x2="750" y2="281" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="450" y1="397" x2="450" y2="421" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="497" x2="600" y2="521" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M887,340 L900,340 L900,560 L889,560" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/>

  <!-- outputs -->
  <g font-size="16" text-anchor="middle">
    <rect x="965" y="70" width="210" height="80" rx="10" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
    <text x="1070" y="103" font-weight="bold">Developer terminal</text>
    <text x="1070" y="128">coloured table + fix</text>
    <rect x="965" y="180" width="210" height="80" rx="10" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
    <text x="1070" y="213" font-weight="bold">Pull request / CI</text>
    <text x="1070" y="238">SARIF annotations, gate</text>
    <rect x="965" y="290" width="210" height="80" rx="10" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
    <text x="1070" y="323" font-weight="bold">Security team</text>
    <text x="1070" y="348">HTML report, attack paths</text>
    <rect x="965" y="400" width="210" height="80" rx="10" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
    <text x="1070" y="433" font-weight="bold">SIEM / tickets</text>
    <text x="1070" y="458">JSON findings</text>
  </g>
  <path d="M917,560 L940,560 L940,110 L961,110" fill="none" stroke="#b35900" stroke-width="2" marker-end="url(#a)"/>
  <line x1="940" y1="220" x2="961" y2="220" stroke="#b35900" stroke-width="2" marker-end="url(#a)"/>
  <line x1="940" y1="330" x2="961" y2="330" stroke="#b35900" stroke-width="2" marker-end="url(#a)"/>
  <line x1="940" y1="440" x2="961" y2="440" stroke="#b35900" stroke-width="2" marker-end="url(#a)"/>
  <text x="600" y="665" font-size="16" font-style="italic" text-anchor="middle">Runs before deployment: no cloud credentials are needed and nothing is called in the cloud.</text>
</svg>
