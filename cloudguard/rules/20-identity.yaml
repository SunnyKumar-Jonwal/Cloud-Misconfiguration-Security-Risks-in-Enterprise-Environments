# Identity and access management.

- id: CG-IAM-001
  title: IAM policy grants full administrator access ("*" on "*")
  severity: critical
  category: identity
  resource_types: [aws_iam_policy, aws_iam_role_policy, aws_iam_user_policy, aws_iam_group_policy]
  description: A statement allows every action on every resource. Anyone who obtains this identity's credentials controls the account.
  when:
    statement:
      path: policy
      where: {effect: Allow, action_is: ["*", "*:*"], resource_in: ["*"]}
  remediation: Replace with least-privilege policies listing only the actions and resources the workload needs; keep administrator access for break-glass roles with MFA.
  fix: |
    Action   = ["s3:GetObject"]
    Resource = ["arn:aws:s3:::<bucket>/<prefix>/*"]
  frameworks: {nist_800_53: [AC-6, AC-2], mitre_attack: [T1078.004, T1098]}

- id: CG-IAM-002
  title: IAM policy grants broad read access to all S3 buckets
  severity: high
  category: identity
  resource_types: [aws_iam_policy, aws_iam_role_policy, aws_iam_user_policy, aws_iam_group_policy]
  description: A statement allows S3 read or list actions on every bucket. If the identity is compromised, all bucket data can be copied; this was the role pattern in the Capital One breach.
  when:
    statement:
      path: policy
      where:
        effect: Allow
        action_covers: ["s3:GetObject"]
        resource_in: ["*", "arn:aws:s3:::*", "arn:aws:s3:::*/*"]
  remediation: Scope S3 permissions to the specific buckets and prefixes the workload uses.
  fix: |
    Resource = ["arn:aws:s3:::acme-app-assets/*"]
  frameworks: {nist_800_53: [AC-6], mitre_attack: [T1530, T1078.004]}

- id: CG-IAM-003
  title: Long-lived IAM user access key is created
  severity: medium
  category: identity
  resource_types: [aws_iam_access_key]
  description: Static access keys do not expire and are often leaked through code, CI logs or laptops. Workloads should use roles with temporary credentials.
  when:
    always: true
  remediation: Use IAM roles (instance profiles, IRSA, OIDC federation for CI) instead of user access keys; if unavoidable, rotate keys at most every 90 days.
  fix: |
    # Remove aws_iam_access_key; grant the workload an IAM role instead.
  frameworks: {nist_800_53: [IA-5, AC-2], mitre_attack: [T1552.001, T1078.004]}

- id: CG-IAM-004
  title: AWS managed AdministratorAccess policy is attached
  severity: high
  category: identity
  resource_types: [aws_iam_role_policy_attachment, aws_iam_user_policy_attachment, aws_iam_group_policy_attachment]
  description: The AdministratorAccess managed policy gives full control of the account to this principal.
  when:
    path: policy_arn
    equals: arn:aws:iam::aws:policy/AdministratorAccess
  remediation: Attach a least-privilege policy; reserve administrator access for tightly controlled break-glass roles.
  fix: |
    policy_arn = aws_iam_policy.least_privilege.arn
  frameworks: {nist_800_53: [AC-6, AC-2], mitre_attack: [T1078.004]}

- id: CG-IAM-005
  title: IAM role can be assumed by any AWS principal
  severity: critical
  category: identity
  resource_types: [aws_iam_role]
  description: The trust policy allows Principal "*" without conditions, so any AWS account can assume the role.
  when:
    statement:
      path: assume_role_policy
      where: {effect: Allow, principal_public: true, has_condition: false}
  remediation: Trust only specific accounts, services or OIDC providers, and add conditions such as sts:ExternalId.
  fix: |
    Principal = { Service = "ec2.amazonaws.com" }
  frameworks: {nist_800_53: [AC-3, AC-6], mitre_attack: [T1078.004]}
