# Logging and monitoring.

- id: CG-LOG-001
  title: No CloudTrail trail is defined
  severity: high
  category: logging
  resource_types: [__inventory__]
  description: The configuration defines AWS resources but no CloudTrail trail, so API activity is not recorded durably for investigation. (Rule applies only when AWS resources are present.)
  when:
    all:
      - not: {inventory_missing: [aws_s3_bucket, aws_instance, aws_iam_role, aws_db_instance]}
      - inventory_missing: [aws_cloudtrail]
  remediation: Create a multi-region trail with log file validation, sending logs to a protected bucket (ideally an organisation trail in a separate log-archive account).
  fix: |
    resource "aws_cloudtrail" "org" {
      name                          = "org-trail"
      s3_bucket_name                = aws_s3_bucket.logs.id
      is_multi_region_trail         = true
      enable_log_file_validation    = true
      include_global_service_events = true
    }
  frameworks: {nist_800_53: [AU-2, AU-12], mitre_attack: [T1562.008]}

- id: CG-LOG-002
  title: CloudTrail trail is not multi-region
  severity: high
  category: logging
  resource_types: [aws_cloudtrail]
  description: Activity in other regions, a common place for attackers to operate unnoticed, is not recorded.
  when:
    path: is_multi_region_trail
    not_equals: true
  remediation: Set is_multi_region_trail = true.
  fix: |
    is_multi_region_trail = true
  frameworks: {nist_800_53: [AU-2, AU-12], mitre_attack: [T1562.008]}

- id: CG-LOG-003
  title: CloudTrail log file validation is disabled
  severity: medium
  category: logging
  resource_types: [aws_cloudtrail]
  description: Without digest files, tampering with or deleting log files cannot be detected.
  when:
    path: enable_log_file_validation
    not_equals: true
  remediation: Set enable_log_file_validation = true.
  fix: |
    enable_log_file_validation = true
  frameworks: {nist_800_53: [AU-9], mitre_attack: [T1070]}

- id: CG-LOG-004
  title: CloudTrail logging is switched off
  severity: high
  category: logging
  resource_types: [aws_cloudtrail]
  description: The trail exists but enable_logging is false, so nothing is recorded.
  when:
    path: enable_logging
    equals: false
  remediation: Set enable_logging = true and alert on StopLogging API calls.
  fix: |
    enable_logging = true
  frameworks: {nist_800_53: [AU-2, AU-12], mitre_attack: [T1562.008]}

- id: CG-VPC-001
  title: VPC has no flow logs
  severity: low
  category: logging
  resource_types: [aws_vpc]
  description: Network traffic metadata is not recorded, which limits investigation of exfiltration and lateral movement.
  when:
    missing_related: {type: aws_flow_log, via: vpc_id}
  remediation: Enable VPC flow logs to CloudWatch Logs or S3.
  fix: |
    resource "aws_flow_log" "this" {
      vpc_id               = aws_vpc.this.id
      traffic_type         = "ALL"
      log_destination_type = "s3"
      log_destination      = aws_s3_bucket.logs.arn
    }
  frameworks: {nist_800_53: [AU-12, SI-4]}
